<style>
:root{color-scheme:dark;--bg:#0e171d;--panel:#19252f;--panel2:#24333e;--text:#eef4f5;--muted:#a2b5bf;--line:#31414a;--accent:#72dac0;--good:#77ddad;--warn:#efcb8c}*{box-sizing:border-box}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:630px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.brand{font-size:21px;font-weight:900;letter-spacing:.5px}.pill{font-size:11px;border:1px solid #35584e;color:var(--accent);border-radius:30px;padding:5px 9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:12px}.muted{color:var(--muted)}.small{font-size:12px}.medium{font-size:13px}.big{font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.6px}.metricGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metricGrid .card{padding:14px 10px;text-align:center}.metricGrid .big{font-size:19px}.section{font-size:17px;font-weight:800;margin:25px 0 11px}.flex{display:flex;gap:12px;align-items:center}.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:8px;border-radius:99px;background:#33484e;overflow:hidden;margin:11px 0 6px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#388a7c,#7adbc0);border-radius:99px}.accent{color:var(--accent)}.warning{color:var(--warn)}.divider{border:0;border-top:1px solid var(--line);margin:13px 0}.note{background:#223a3d;padding:12px;border-radius:12px;font-size:13px;margin-top:10px}.goalrow{padding:11px 0;border-bottom:1px solid var(--line)}.goalrow:last-child{border:0;padding-bottom:0}.tag{font-size:11px;background:#2a4142;color:#a8eddd;border-radius:6px;padding:3px 7px;white-space:nowrap}.tag.off{background:#303841;color:var(--muted)}.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(17,28,35,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9;backdrop-filter:blur(12px)}.tabbar button{flex:1;max-width:160px;background:none;color:var(--muted);border:0;padding:12px 0 10px;font-size:12px}.tabbar button.on{color:var(--accent);font-weight:800}.tabbar b{display:block;font-size:20px;line-height:1.2}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{background:var(--accent);border:0;color:#102824;border-radius:12px;font-weight:800;padding:11px 18px}.btn.secondary{background:#293c47;color:var(--text);border:1px solid #46606d}.btn.danger{background:#453135;color:#ffd0d0}.btn.full{width:100%;margin-top:7px}label{font-size:12px;color:var(--muted);display:block;margin:13px 0 5px}input,select,textarea{width:100%;background:#0e1a22;border:1px solid #465761;color:var(--text);border-radius:10px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:65px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}.badgeRow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.badgeBox{text-align:center;padding:12px 2px;border:1px solid var(--line);border-radius:12px;background:#26343e;opacity:.38}.badgeBox.earned{opacity:1;border-color:#4e8c7f;background:#24413e}.badgeBox .medal{font-size:22px}.badgeBox .small{font-size:11px}h1,h2,h3,p{margin:0}.notice{color:var(--warn);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.weekday{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday label{margin:0;border:1px solid var(--line);border-radius:9px;text-align:center;padding:9px 0;color:var(--text);font-size:12px}.weekday input{display:none}.weekday label:has(input:checked){background:#30574f;border-color:#70c3ac}.empty{padding:20px;text- </head><body><div id="root"></div><div class="tabbar" id="nav"></div>
<script>
(()=>{'use strict';
const KEY='nagoya-run-mvp-v1',RACE='2027-03-14',RACE_KM=21.0975, XP_PER=20, LEVEL_STEP=200;
const METRICS={daily_km:['1回の距離','km','daily'],daily_minutes:['1回の時間','分','daily'],daily_pace:['1回の平均ペース以下','秒/km','daily'],week_sessions:['週の運動回数','回','weekly'],week_km:['週の累計距離','km','weekly'],week_avg_km:['週の平均距離','km','weekly'],week_avg_minutes:['週の平均時間','分','weekly'],week_avg_pace:['週の平均ペース以下','秒/km','weekly']};
const $=q=>document.querySelector(q), dateObj=s=>new Date(s+'T12:00:00'),isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>isoDate(new Date()), daysBetween=(a,b)=>Math.round((dateObj(b)-dateObj(a))/86400000),weekStart=s=>{let d=dateObj(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return isoDate(d)},dateAdd=(s,days)=>{let d=dateObj(s);d.setDate(d.getDate()+days);return isoDate(d)},recEntries=()=>Object.entries(data.records).filter(([d,r])=>r&&!r.rest&&Number(r.km)>0&&Number(r.minutes)>0).sort((a,b)=>a[0].localeCompare(b[0]));
const defaultGoals=()=>[{id:0,name:'週3回走る',metric:'week_sessions',target:3,active:true,since:'2000-01-01'},{id:1,name:'20分動く',metric:'daily_minutes',target:20,active:true,since:'2000-01-01'},{id:2,name:'3km動く',metric:'daily_km',target:3,active:true,since:'2000-01-01'},...([3,4].map(id=>({id,name:'',metric:'daily_km',target:3,active:false,since:'2000-01-01'})))];
const initial=()=>({records:{},goals:defaultGoals(),awards:[],rests:[],restMode:'skip',streakReset:'',badges:[]});
let data;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):initial();if(!data||!data.records||!Array.isArray(data.goals))throw Error('bad data');}catch(e){data=initial();alert('記録データを読み込めません。端末ストレージの状態を確認してね。');}
if(!Array.isArray(data.badges))data.badges=[];
let tab='home',editing=today(),editGoal=null;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存できなかったよ。iPhoneの空き容量やSafari設定を確認してね。');return false}}
function getWeekRecords(anchor){const start=weekStart(anchor);return recEntries().filter(([d])=>d>=start&&d<=dateAdd(start,6))}
function metricValue(metric,at,since){let records;if(metric.startsWith('daily_')){let r=data.records[at];if(!r||r.rest||!r.km||!r.minutes)return null;records=[[at,r]]}else{records=getWeekRecords(at)}const totalK=records.reduce((s,[,r])=>s+Number(r.km),0),totalM=records.reduce((s,[,r])=>s+Number(r.minutes),0);if(metric==='daily_km')return totalK;if(metric==='daily_minutes')return totalM;if(metric==='daily_pace')return totalM*60/totalK;if(metric==='week_sessions')return records.length;if(metric==='week_km')return records.length?totalK:null;if(metric==='week_avg_km')return records.length?totalK/records.length:null;if(metric==='week_avg_minutes')return records.length?totalM/records.length:null;if(metric==='week_avg_pace')return totalK?totalM*60/totalK:null;return null}
function awardIfEligible(at){let changed=false;for(const g of data.goals){if(!g.active||at<g.since||!METRICS[g.metric])continue;const period=METRICS[g.metric][2];const key=period==='daily'?`${at}:slot${g.id}`:`${weekStart(at)}:week-slot${g.id}`;if(data.awards.some(a=>a.key===key||a.goalId===g.id&&a.date===at))continue;const val=metricValue(g.metric,at,g.since);if(val===null)continue;const eligible=g.metric.endsWith('pace')?val<=g.target:val>=g.target;if(!eligible)continue;const credited=data.awards.filter(a=>a.date===at).length;if(credited>=5)continue;data.awards.push({key,date:at,goalId:g.id,xp:XP_PER,name:g.name});changed=true}return changed}
function fmtPace(seconds){if(!Number.isFinite(seconds)||seconds<=0)return'—';const x=Math.round(seconds);return`${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`}
function jpDate(s){const d=dateObj(s);return`${d.getMonth()+1}月${d.getDate()}日`}
function xp(){return data.awards.reduce((s,a)=>s+(Number(a.xp)||0),0)}
function isRest(d){const day=dateObj(d).getDay();return data.rests.includes(day)}
function dayHasAchievement(d){return data.awards.some(a=>a.date===d)}
function streak(){let d=today(),count=0,max=0,active=true;const first=Object.keys(data.records).concat(data.awards.map(a=>a.date)).sort()[0];if(!first)return 0;const boundary=data.streakReset||first;for(let i=0;i<1000&&d>=boundary;i++,d=dateAdd(d,-1)){if(dayHasAchievement(d)){count++;max=count;continue}if(isRest(d)&&data.restMode==='skip')continue;if(isRest(d)&&data.restMode==='credit'){count++;max=count;continue}if(d===today())continue;break}return max}
function updateBadges(){let st=streak();for(let n of [20,40,60,80,100])if(st>=n&&!data.badges.includes(n))data.badges.push(n)}
function countDays(){return new Set(recEntries().map(x=>x[0])).size}
function best(){return Math.max(0,...recEntries().map(([,r])=>Number(r.km)))}
function raceComments(limit=4){
const entries=recEntries(),daysLeft=Math.max(0,daysBetween(today(),RACE)),out=[];
if(!entries.length)return ['【スタート】まずは短い距離・時間でも記録しよう。週3回・20分・3kmは変更できる仮の初期目標だよ。','【大会基準】21.0975kmを制限3時間以内。特に最初の6kmの関門は実際のスタート通過時刻に左右されるよ。'].slice(0,limit);
const [date,last]=entries.at(-1),distance=Number(last.km),mins=Number(last.minutes),pace=mins*60/distance,fatigue=Number(last.fatigue),maxDistance=best();
if(fatigue>=4)out.push('【疲労】今回の疲労感は高め。次回のペースや距離を無理に伸ばさず、回復を優先しよう。痛みがある場合は運動を控えてね。');
if(maxDistance>=RACE_KM)out.push('【距離】ハーフと同じ21.0975km以上の実績があるね。ただし本番の関門通過やその日の体調まで保証するものではないよ。');
else if(maxDistance>=15.7)out.push('【距離】過去最長が15.7kmを突破。名古屋の第3関門と同じ距離まで経験済み。最後の5km余りを動き続ける力が次の焦点。');
else if(maxDistance>=10.4)out.push('【距離】過去最長が10.4kmを突破。名古屋の第2関門距離に到達したね。今後は疲労を管理しながら距離耐性を育てよう。');
else if(maxDistance>=6)out.push('【距離】過去最長6kmを達成。名古屋の第1関門と同じ距離まで動けた実績だね。大会距離はこの約3.5倍あることも意識しよう。');
else if(maxDistance>=3)out.push('【距離】3km以上の実績ができているよ。まずは負担を抑えて繰り返し、次の6kmに向けた土台をつくろう。');
else out.push('【距離】今は最長距離を競う段階ではないよ。走る・歩くを組み合わせても大丈夫。継続できる時間を増やしていこう。');
if(distance>=6){
 if(pace<=430)out.push(`【第1関門】直近${distance.toFixed(2)}kmの平均${fmtPace(pace)}/kmは、最遅スタート10:40から逆算した6km関門ペース7:10/kmを満たす参考記録。ただし序盤の混雑と後半の持久力は別問題だよ。`);
 else out.push(`【第1関門】直近の平均は${fmtPace(pace)}/km。10:40にスタート線を越える場合、6km関門まで約7:10/kmが必要。現状との差は確認できるけれど、急激なスピード練習は避けよう。`);
}else out.push('【第1関門】6km以上の記録がまだ少ないため、関門ペースは未評価。短距離のペースだけで通過可否は判定しないよ。');
const recent14=entries.filter(([d])=>d>=dateAdd(today(),-13)).length,recent28=entries.filter(([d])=>d>=dateAdd(today(),-27)).length;
if(recent14>=6)out.push(`【継続】直近14日間で${recent14}回の活動実績があるね。安定した頻度は強み。休息日も大切にしよう。`);
else if(recent14>=2)out.push(`【継続】直近14日間で${recent14}回。無理せず、まずは自分に合う週間リズムを保てるかがポイント。`);
else out.push(`【継続】直近14日間で${recent14}回の実績。まずは短時間でも記録を積み重ねて、持続できるペースをつくろう。`);
const prev=entries.at(-2);
if(prev&&Math.abs(Number(prev[1].km)-distance)/Math.max(distance,0.001)<=0.15){const pp=Number(prev[1].minutes)*60/Number(prev[1].km);if(pace<pp-10)out.push(`【前回比】ほぼ同じ距離で前回より約${Math.round(pp-pace)}秒/km速い記録。疲労感も含めて、無理のない変化か確認しよう。`);else if(pace>pp+10)out.push('【前回比】ほぼ同じ距離で前回よりペースはゆっくり。疲労や気温の影響もあるので、必ずしも後退ではないよ。');else out.push('【前回比】ほぼ同じ距離・ペースを維持。安定して再現できることも立派な成長だよ。');}
if(daysLeft<=21)out.push('【大会まで】残り3週間以内。直前に長距離や高強度を詰め込むより、体調を整えることを優先しよう。');
else if(daysLeft<=60&&maxDistance<10.4)out.push(`【大会まで】残り${daysLeft}日。最長距離が第2関門の10.4km未満なので、今後の走行時間・距離を無理なく積み上げたい段階だよ。`);
else if(daysLeft>60&&recent28<4)out.push(`【大会まで】残り${daysLeft}日。まず運動頻度と休息のリズムを作り、距離とペースの評価精度を高めていこう。`);
return out.slice(0,limit);
}
function shell(title,html){$('#root').innerHTML=`<main class="wrap"><header class="top"><div><div class="eyebrow">ROAD TO NAGOYA 2027</div><div class="brand">${esc(title)}</div></div><div class="pill">3.14 SUN</div></header>${html}</main>`;$('#nav').innerHTML=[['home','⌂','ホーム'],['record','＋','記録'],['analysis','▥','分析'],['goals','⚑','目標']].map(([id,icon,n])=>`<button data-tab="${id}" class="${tab===id?'on':''}"><b>${icon}</b>${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function home(){const entries=getWeekRecords(today()),km=entries.reduce((s,[,r])=>s+Number(r.km),0),remain=Math.max(0,daysBetween(today(),RACE)),total=xp(),lvl=Math.floor(total/LEVEL_STEP)+1,st=streak(),b=best(),msg=raceComments();shell('完走までの記録',`
<div class="card"><div class="muted small">名古屋シティマラソン2027まで</div><div class="spread"><div class="big">あと ${remain} 日</div><div class="accent small">21.0975km / 制限3時間</div></div><div class="progress"><i style="width:${Math.min(100,b/RACE_KM*100)}%"></i></div><div class="small muted">過去最長 ${b.toFixed(2)}km ／ 大会距離の ${(b/RACE_KM*100).toFixed(1)}% （完走準備率ではない）</div></div>
<div class="metricGrid"><div class="card"><div class="muted small">今週の距離</div><div class="big">${km.toFixed(1)}<span class="small"> km</span></div></div><div class="card"><div class="muted small">今週の回数</div><div class="big">${entries.length}<span class="small"> 回</span></div></div><div class="card"><div class="muted small">連続達成</div><div class="big">${st}<span class="small"> 日</span></div></div></div>
<div class="card"><div class="spread"><div><div class="muted small">レベル ${lvl}</div><div class="big">${total} <span class="small">XP</span></div></div><div class="small muted">次のLvまで ${LEVEL_STEP-total%LEVEL_STEP} XP</div></div><div class="progress"><i style="width:${total%LEVEL_STEP/LEVEL_STEP*100}%"></i></div></div>
<h2 class="section">名古屋ハーフへの評価</h2><div class="card"><div class="muted small">直近の記録に基づくコメント</div>${msg.map(s=>`<div class="note">${esc(s)}</div>`).join('')}<div class="foot">練習記録からの参考評価。完走予測・医療上の判断ではないよ。</div></div>
<h2 class="section">連続達成バッジ</h2><div class="badgeRow">${[20,40,60,80,100].map(n=>`<div class="badgeBox ${data.badges.includes(n)?'earned':''}"><div class="medal">🏅</div><b>${n}</b><div class="small">達成</div></div>`).join('')}</div><p class="foot">達成した日に+1。設定した休息日は「維持」なら連続記録を途切れさせない。</p>
<h2 class="section">今日の目標</h2><div class="card">${goalSummary()}</div><button class="btn full" id="goRecord">今日の記録を入力</button>`);$('#goRecord').onclick=()=>{editing=today();tab='record';render()}}
function metricText(g){if(g.metric.endsWith('pace'))return`${fmtPace(g.target)} /km以下`;const unit=METRICS[g.metric]?.[1]||'';return `${g.target} ${unit}以上`}
function goalSummary(){const gs=data.goals.filter(g=>g.active);if(!gs.length)return'<p class="empty">まだ目標がないよ。目標タブで作れる。</p>';return gs.map(g=>{const val=metricValue(g.metric,today(),g.since),v=val===null?'記録なし':g.metric.endsWith('pace')?`${fmtPace(val)} /km`:`${Number(val.toFixed(2))} ${METRICS[g.metric][1]}`,period=METRICS[g.metric][2],key=period==='daily'?`${today()}:slot${g.id}`:`${weekStart(today())}:week-slot${g.id}`,done=data.awards.some(a=>a.key===key);return `<div class="goalrow"><div class="spread"><b>${esc(g.name)}</b><span class="tag ${done?'':'off'}">${done?'達成 +20XP':period==='weekly'?'今週':'今日'}</span></div><div class="medium muted">${esc(METRICS[g.metric][0])}：${esc(metricText(g))} ／ 現在 ${esc(v)}</div></div>`}).join('')}
function recordPage(){const r=data.records[editing]||{km:'',minutes:'',fatigue:2,note:'',rest:false};shell('今日の記録を残す',`<div class="card"><form id="recForm"><label>日付</label><input type="date" name="date" max="${today()}" value="${esc(editing)}" required/><div class="two"><div><label>距離（km）</label><input name="km" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(r.km??'')}" /></div><div><label>時間（分）</label><input name="minutes" inputmode="decimal" type="number" min="0" step="0.1" value="${esc(r.minutes??'')}"/></div></div><label>疲労感（1：余裕〜5：かなり疲れた）</label><select name="fatigue">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(r.fatigue)===n?'selected':''}>${n} ${['','余裕','少し疲れた','普通','疲れた','かなり疲れた'][n]}</option>`).join('')}</select><label><input style="width:auto" type="checkbox" name="rest" ${r.rest?'checked':''}/> この日は休息日として記録</label><label>ひとこと（任意）</label><textarea name="note" placeholder="体調や練習の感想をメモ">${esc(r.note)}</textarea><p class="foot">平均ペースは距離と時間から自動計算。保存後、条件を満たした目標ごとにXPを加算するよ。</p><button class="btn full" type="submit">保存して判定</button></form><div class="actions" style="margin-top:10px"><button class="btn secondary" id="setToday">今日へ戻る</button><button class="btn danger" id="deleteRecord">この日の記録を削除</button></div></div><div class="card"><b>記録の一覧（最近10件）</b>${recEntries().slice(-10).reverse().map(([d,r])=>`<div class="goalrow spread"><div><b>${jpDate(d)}</b><div class="medium muted">${Number(r.km).toFixed(2)}km / ${Number(r.minutes)}分 / ${fmtPace(Number(r.minutes)*60/Number(r.km))}/km</div></div><button class="btn secondary" data-edit="${d}">編集</button></div>`).join('')||'<div class="empty">まだ記録がないよ</div>'}</div>`);
const form=$('#recForm');form.elements.date.onchange=e=>{editing=e.target.value;if(editing>today()){editing=today()}render()};form.onsubmit=e=>{e.preventDefault();const f=form.elements,d=editing,rest=f.rest.checked,km=Number(f.km.value),minutes=Number(f.minutes.value);if(!rest&&(!(km>0)||!(minutes>0))){alert('運動した日は距離と時間を両方入力してね。');return}data.records[d]={km:rest?0:km,minutes:rest?0:minutes,fatigue:Number(f.fatigue.value),note:f.note.value.trim().slice(0,500),rest};const countBefore=data.awards.length;awardIfEligible(d);updateBadges();if(save()){const got=data.awards.length-countBefore;alert(got?`保存したよ！ +${got*XP_PER} XP`:'保存したよ！');tab='home';render()}};$('#setToday').onclick=()=>{editing=today();render()};$('#deleteRecord').onclick=()=>{if(!data.records[editing])return alert('この日の記録はまだないよ。');if(confirm('この日の運動記録を削除する？ すでに獲得したXPは維持するよ。')){delete data.records[editing];save();render()}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render()})}
function analysisPage(){const es=recEntries(),allK=es.reduce((s,[,r])=>s+Number(r.km),0),allMin=es.reduce((s,[,r])=>s+Number(r.minutes),0),prev=es.at(-2),last=es.at(-1),weeks=[];for(let i=3;i>=0;i--){const w=dateAdd(weekStart(today()),-7*i),arr=getWeekRecords(w),km=arr.reduce((s,[,r])=>s+Number(r.km),0);weeks.push({w,km,count:arr.length,avg:arr.length?km/arr.length:0})}const maxV=Math.max(1,...weeks.map(w=>w.km));let comparison='比較に必要な記録がまだないよ。';const currentWeek=weeks[3],priorWeek=weeks[2];let weekVs='前週の記録がないため比較対象なし。';if(priorWeek.count&&currentWeek.count){let delta=(currentWeek.avg-priorWeek.avg)/priorWeek.avg*100;weekVs=`前週の1回平均 ${priorWeek.avg.toFixed(2)}km → 今週 ${currentWeek.avg.toFixed(2)}km（${delta>=0?'+':''}${delta.toFixed(1)}%）。週の途中は暫定比較だよ。`}const prevDay=dateAdd(today(),-1),yday=data.records[prevDay],td=data.records[today()];let yesterdayVs='今日と前日の双方に運動記録がないため比較対象なし。';if(td&&!td.rest&&td.km>0&&yday&&!yday.rest&&yday.km>0){const pct=(td.km-yday.km)/yday.km*100;yesterdayVs=`前日 ${Number(yday.km).toFixed(2)}km → 今日 ${Number(td.km).toFixed(2)}km（${pct>=0?'+':''}${pct.toFixed(1)}%）。休息日は比較しないよ。`}if(prev&&last){const p=Number(prev[1].km),c=Number(last[1].km),diff=((c-p)/p*100);comparison=`前回 ${p.toFixed(2)}km → 今回 ${c.toFixed(2)}km（${diff>=0?'+':''}${diff.toFixed(1)}%）。距離差が大きい日はペースだけで優劣をつけないよ。`}
shell('成長の分析',`<div class="metricGrid"><div class="card"><div class="small muted">累計距離</div><div class="big">${allK.toFixed(1)}<span class="small">km</span></div></div><div class="card"><div class="small muted">最長距離</div><div class="big">${best().toFixed(1)}<span class="small">km</span></div></div><div class="card"><div class="small muted">運動日数</div><div class="big">${countDays()}<span class="small">日</span></div></div></div><div class="card"><b>直近4週間の走行距離</b>${weeks.map(w=>`<div style="margin-top:12px"><div class="spread medium"><span>${jpDate(w.w)}の週 <span class="muted">${w.count}回 / 平均${w.avg.toFixed(1)}km</span></span><b>${w.km.toFixed(1)}km</b></div><div class="progress"><i style="width:${Math.max(0,w.km/maxV*100)}%"></i></div></div>`).join('')}<p class="foot">月曜日始まり。週平均はその週に運動した日数を母数に計算する。</p></div><div class="card"><b>過去の自分との比較</b><p class="note">${esc(comparison)}</p><p class="note">前日比：${esc(yesterdayVs)}</p><p class="note">前週の1回平均比：${esc(weekVs)}</p><div class="medium muted" style="margin-top:12px">これまでの総運動時間：${Math.round(allMin)}分 ／ 全記録の加重平均ペース：${fmtPace(allK?allMin*60/allK:0)}/km</div></div><h2 class="section">名古屋ハーフの評価ポイント</h2><div class="card"><div class="goalrow"><b>6.0km</b> <span class="muted medium">第1関門 11:23 / 最遅スタート10:40なら7:10/km</span></div><div class="goalrow"><b>10.4km</b> <span class="muted medium">第2関門 11:55</span></div><div class="goalrow"><b>15.7km</b> <span class="muted medium">第3関門 12:35</span></div><div class="goalrow"><b>21.0975km</b> <span class="muted medium">ゴール 13:20</span></div><div class="note">${raceComments(8).map(esc).join('<hr class="divider"/>')}</div><p class="foot">公式大会要項を基にした参考指標。練習の平均ペースと関門通過の可否は同一ではない。</p></div>`)}
function goalsPage(){const cards=data.goals.map(g=>`<div class="goalrow"><div class="spread"><div><b>${esc(g.name||`空き枠 ${g.id+1}`)}</b><div class="small muted">${g.active?`${esc(METRICS[g.metric][0])} ${esc(metricText(g))}`:'未使用'}</div></div><button class="btn secondary" data-slot="${g.id}">編集</button></div></div>`).join('');const options=Object.entries(METRICS).map(([id,[label]])=>`<option value="${id}">${label}</option>`).join('');shell('目標と設定',`<div class="card"><b>自由目標（最大5枠）</b><p class="foot">目標名・種類・数値を変更できるよ。変更後も過去XPは維持。新条件は変更日から判定し、枠ごとの重複加算を防ぐ。</p>${cards}</div><div class="card" id="goalEditor" style="display:none"><b>目標を編集</b><form id="goalForm"><label>目標名</label><input name="name" maxlength="40" required/><label>判定項目</label><select name="metric">${options}</select><label>達成ライン</label><input name="target" type="number" min="0.01" step="0.01" required/><p class="foot">ペース目標だけは秒/kmで入力（例：7分10秒なら430）。それ以外は表示単位で入力。</p><label><input type="checkbox" style="width:auto" name="active"/> この目標を使う</label><div class="actions" style="margin-top:13px"><button class="btn" type="submit">保存</button><button type="button" class="btn secondary" id="cancelGoal">キャンセル</button></div></form></div>
<div class="card"><b>休息日の設定</b><p class="foot">曜日を選ぶと、連続記録の判定に反映される。走った日は通常通り達成として扱う。</p><div class="weekday">${[[1,'月'],[2,'火'],[3,'水'],[4,'木'],[5,'金'],[6,'土'],[0,'日']].map(([d,n])=>`<label><input type="checkbox" class="restDay" value="${d}" ${data.rests.includes(d)?'checked':''}/>${n}</label>`).join('')}</div><label>休息日の連続記録</label><select id="restMode"><option value="skip" ${data.restMode==='skip'?'selected':''}>継続だけ維持（推奨）</option><option value="credit" ${data.restMode==='credit'?'selected':''}>1日としてカウント</option><option value="break" ${data.restMode==='break'?'selected':''}>記録を途切れさせる</option></select><button class="btn secondary full" id="saveRest">休息日の設定を保存</button></div>
<div class="card"><b>連続記録のリセット</b><p class="foot">過去の運動記録・XP・目標達成履歴は消さない。連続達成のカウントだけゼロから再開。</p><button class="btn danger full" id="resetStreak">連続記録のみリセット</button></div><p class="foot">データはこの端末のブラウザ保存領域に保存。端末変更・Safariのデータ削除などで消える場合があるよ。バックアップ機能は今回実装しない。</p>`);
document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{editGoal=data.goals.find(g=>g.id===Number(b.dataset.slot));const card=$('#goalEditor'),f=$('#goalForm');card.style.display='block';f.elements.name.value=editGoal.name;f.elements.metric.value=editGoal.metric;f.elements.target.value=editGoal.target;f.elements.active.checked=editGoal.active;card.scrollIntoView({behavior:'smooth',block:'center'})});$('#cancelGoal').onclick=()=>$('#goalEditor').style.display='none';$('#goalForm').onsubmit=e=>{e.preventDefault();const f=e.target.elements;const target=Number(f.target.value);if(!(target>0))return alert('目標値は0より大きい数字にしてね。');const id=editGoal.id;data.goals[id]={id,name:f.name.value.trim(),metric:f.metric.value,target,active:f.active.checked,since:today()};awardIfEligible(today());updateBadges();save();render()};$('#saveRest').onclick=()=>{data.rests=[...document.querySelectorAll('.restDay:checked')].map(el=>Number(el.value));data.restMode=$('#restMode').value;updateBadges();save();render();alert('休息日を保存したよ。')};$('#resetStreak').onclick=()=>{if(confirm('連続達成記録だけをリセットする？ 運動記録とXPは維持するよ。')){data.streakReset=dateAdd(today(),1);save();render()}}}
function render(){if(tab==='home')home();if(tab==='record')recordPage();if(tab==='analysis')analysisPage();if(tab==='goals')goalsPage()}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
