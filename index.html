</style></head><body><div id="root"></div><nav id="nav" class="tabbar" aria-label="メインメニュー"></nav><script>(()=>{'use strict';

 {lv:1,name:'最初の20分',phase:'走歩の基礎',period:'10月〜11月ごろ',condition:'20分以上の運動を1回',meaning:'20分動く経験ができた段階',training:[20,20,25],focus:'運動間に休養日を入れ、20分を楽に繰り返す。',check:e=>countWhere(e,r=>+r.minutes>=20)>=1},

 {lv:4,name:'5kmを安定',phase:'短距離の安定',period:'11月〜12月ごろ',condition:'42日間で5km以上を2回、28日間で合計4回',meaning:'5kmを一度でなく繰り返せる段階',training:[30,35,45],focus:'楽な5km前後を繰り返し、余裕がある週だけ長めの時間を少し延長。',check:e=>{let d=e.at(-1)[0];return countWhere(e.filter(([day])=>day>=shift(d,-41)),r=>+r.km>=5&&safeToPromote(r))>=2&&e.filter(([day])=>day>=shift(d,-27)).length>=4}},
 {lv:5,name:'8kmに対応',phase:'持久力づくり',period:'11月〜12月ごろ',condition:'56日間で8km以上を1回、42日間に5回',meaning:'長めの運動への適応を始めた段階',training:[35,40,55],focus:'短い練習を継続しつつ、週1回だけ長めの運動を取り入れる。',check:e=>{let d=e.at(-1)[0];return countWhere(e.filter(([day])=>day>=shift(d,-55)),r=>+r.km>=8&&safeToPromote(r))>=1&&e.filter(([day])=>day>=shift(d,-41)).length>=5}},
 {lv:6,name:'10kmの土台',phase:'持久力づくり',period:'12月〜1月ごろ',condition:'56日間で10km以上を1回、合計6回',meaning:'ハーフの約半分に相当する距離を経験',training:[40,45,65],focus:'楽な練習を中心に、長めの運動の後の回復を確認する。',check:e=>{let k=e.filter(([day])=>day>=shift(e.at(-1)[0],-55));return countWhere(k,r=>+r.km>=10&&safeToPromote(r))>=1&&k.length>=6}},
 {lv:7,name:'13kmの持久力',phase:'持久力づくり',period:'1月ごろ',condition:'56日間で13km以上を1回、合計8回',meaning:'ハーフ後半を意識した長時間運動の経験',training:[40,50,75],focus:'距離の延長より、疲れを翌週に残さない練習を優先する。',check:e=>{let k=e.filter(([day])=>day>=shift(e.at(-1)[0],-55));return countWhere(k,r=>+r.km>=13&&safeToPromote(r))>=1&&k.length>=8}},
 {lv:8,name:'16kmの持久力',phase:'距離＋関門',period:'1月〜2月ごろ',condition:'70日間で16km以上を1回、合計10回',meaning:'長距離への適応。ただし完走可能とはまだ言えない',training:[45,50,85],focus:'長距離の持続力と回復力を保ちつつ、関門ペースの準備を始める。',check:e=>{let k=e.filter(([day])=>day>=shift(e.at(-1)[0],-69));return countWhere(k,r=>+r.km>=16&&safeToPromote(r))>=1&&k.length>=10}},

function progressState(){
 const es=records();let achieved=0;

 for(let end=0;end<es.length;end++){
  const soFar=es.slice(0,end+1);
  for(let level=achieved+1;level<LEVELS.length;level++){
   if(!LEVELS[level].check(soFar))break;

  }

function currentCheckin(){return data.checkins[today()]||null}

 if(todayState==='sore')return {status:'recover',title:'軽めの活動・回復',desc:'軽い筋肉痛がある日は走力を試さず、無理のない散歩など。悪化するなら中止。'};

 if(last&&days(last[0],today())<=1)return {status:'rest',title:'ランニングを休む日',desc:'前回から1日以内だよ。初心者の段階では走る日の間に回復日を設けよう。'};
 if(last&&days(last[0],today())>=14)return {status:'restart',title:'負荷を下げて再開',desc:'しばらく練習が空いているので、以前の距離をいきなり再現しないようにしよう。'};
 if(last&&sessionEffort(last[1])===3)return {status:'recover',title:'前回の負荷を下げて再開',desc:'前回はかなりきつかった記録だよ。走歩交互で短めに。'};
 return {status:'ready',title:'レベルに合った練習が候補',desc:'直近の状態で中止を示す情報はないよ。運動前にも体調を確認してね。'};

function planForToday(){
 const p=progressState(),state=conditionStatus(),last=lastTraining(),weeks=raceLeft(),base=p.stage.training;
 if(weeks===0)return {title:'大会当日・大会後',minutes:0,type:'調整',detail:'本日は新しい練習を追加せず、体調と大会の案内を最優先に。',reason:'大会日に入っているため'};
 if(state.status==='alert')return {title:'練習をいったん保留',minutes:0,type:'安全確認',detail:state.desc,reason:'運動中の症状や痛みの確認が必要なため'};
 if(state.status==='rest')return {title:'今日は回復日',minutes:0,type:'休養',detail:state.desc+' 休養もロードマップの一部だよ。',reason:'負荷を追加するより回復が大切なため'};
 if(state.status==='recover')return {title:'体調に合わせた軽い活動',minutes:15,type:'回復',detail:state.desc+' 走る練習は回復してから。',reason:'今のコンディションに合わせて調整'};
 if(weeks<=14){return {title:'大会直前：疲労を抜く練習',minutes:Math.min(30,base[0]),type:'調整',detail:'新しい最長距離やスピードへの挑戦は避け、楽な運動を短めに。',reason:'大会まで2週間以内の調整期だから'};}
 if(state.status==='restart')return {title:'走歩交互で再開',minutes:20,type:'再開',detail:'最初と最後に5分ずつ歩く。楽な強さを優先し、以前の最長距離を目指さない。',reason:state.desc};

 if(last){
  const effort=sessionEffort(last[1]);
  // Keep single-session increases modest until the user has repeated evidence of recovery.
  if(effort===1&&last[1].pain!=='yes'&&last[1].symptoms!=='alert'&&records().length>=3){mins=Math.min(base[1],Math.max(base[0],Math.round(+last[1].minutes+5)));type='維持・微増';detail='前回に余裕があったため、急に距離を伸ばさず最大5分程度まで時間を調整。'+p.stage.focus;}
  if(effort===2){mins=Math.min(base[1],Math.max(base[0],Math.round(+last[1].minutes)));type='同程度を再現';detail='前回が適度な負荷だったので、まず同じくらいの時間を安定して繰り返そう。'+p.stage.focus;}
  // Very long previous session should NOT drag easy session duration beyond the level's plan.
  mins=Math.min(mins,base[1]);
 }
 if(p.lv>=9){detail+=' ペースを意識する練習は体調がよい日だけ。通常の練習は会話できる強さで。';}
 return {title:`${mins}分の楽な${p.lv>=8?'ランニング／走歩':'走歩交互'}`,minutes:mins,type,detail,reason:`現在 Lv.${p.lv}「${p.stage.name}」の練習メニューから選択`};

function paceOutlook(){
 const es=rangeRecords(90).filter(([,r])=>+r.km>=10&&r.mode!=='walk'&&safeToPromote(r)),long=bestKm(records());

 <h2 class="section">距離とペースの推移</h2><div class="card"><div class="small muted">表示期間を切り替え</div><div class="segmented">${[['14','14日'],['30','30日'],['all','全期間']].map(([v,n])=>`<button type="button" data-range="${v}" class="${v===analysisRange?'on':''}">${n}</button>`).join('')}</div><p class="foot">${analysisRange==='all'?'最初の記録から現在まで。':'指定日数内の練習。'} ${shown.length}回の実績を表示${groupByWeek?'（週単位集計）':''}。</p>
 <div class="rowline"><b>距離の推移（km）</b>${svgTrend(shown,analysisRange,'km')}</div><div class="rowline"><b>ペースの推移（分:秒/km）</b>${svgTrend(shown,analysisRange,'pace')}</div>
 <p class="foot">練習強度・走歩配分・コースが異なる日は、ペースの変化だけで成長を断定できないよ。</p></div>
 <div class="card"><b>累計距離の積み上がり</b><p class="small muted">最初の記録からの全期間</p>${cumulativeChart(all)}</div>
 <h2 class="section">月ごとの積み上がり</h2><div class="card">${monthlyRows(all)||'<div class="empty">練習を記録すると月別の累計が表示されるよ。</div>'}</div>
 <h2 class="section">記録の履歴</h2><div class="card">${(showAllHistory?all.slice().reverse():all.slice(-12).reverse()).map(([d,r])=>`<div class="rowline spread"><div><b>${esc(d)}</b><div class="small muted">${num(r.km)}km ／ ${num(r.minutes)}分 ／ ${pace(paceOf(r))}/km</div></div><button type="button" class="btn sub smallbtn" data-edit="${esc(d)}">編集</button></div>`).join('')||'<div class="empty">記録はまだないよ。</div>'}${all.length>12?`<button class="btn sub full" id="historyToggle">${showAllHistory?'直近12件に戻す':'すべての履歴を見る（'+all.length+'件）'}</button>`:''}</div>
 <h2 class="section">大会で必要なペースと見込み</h2><div class="card"><div class="rowline"><b>現時点の見込み</b><p class="note">${esc(raceFeedback())}</p></div><div class="rowline spread"><div class="small muted">10:35スタート：第1関門6km</div><b>8:00/km以下</b></div><div class="rowline spread"><div class="small muted">10:40スタート：第1関門6km</div><b>7:10/km以下</b></div><p class="foot">いずれも閉鎖時刻ちょうどの必要平均で、余裕時間を含まない。実際のスタート通過時刻・後方の混雑・天候・他の関門によって必要な余裕は変わるよ。記録が十分になったときの推定は独自の距離延長式による幅の広い参考値。</p></div>
 <h2 class="section">次の練習につながる分析</h2><div class="card"><p class="note">${esc(raceFeedback())}</p><p class="note">現在のロードマップ：Lv.${progressState().lv}「${esc(progressState().stage.name)}」</p><p class="note">次の行動：${esc(planForToday().title)}</p><button class="btn full" id="toPlan">練習ロードマップを見る →</button></div><p class="foot">記録は端末の保存領域に保管。サイトデータ削除や端末変更では失われる場合があるよ。</p>`);
 document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{analysisRange=b.dataset.range;render()});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;tab='record';render()});
 if($('#historyToggle'))$('#historyToggle').onclick=()=>{showAllHistory=!showAllHistory;render()};
 $('#toPlan').onclick=()=>{tab='plan';render()};
}
function render(){if(tab==='home')home();else if(tab==='plan')planPage();else if(tab==='record')recordPage();else analysisPage()}
// A previous version's records are read with the same key. No migration/deletion is performed.
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
