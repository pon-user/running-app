<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>NAGOYA RUN | 完走までの伴走</title>
<style>
:root{color-scheme:dark;--bg:#0e171d;--panel:#19252f;--panel2:#263a42;--line:#33454d;--text:#f0f6f7;--muted:#acbec8;--accent:#79ddc4;--warn:#ffd59c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input,select{font:inherit}
.wrap{max-width:630px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(94px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:2px}.brand{font-size:21px;font-weight:850}.pill{color:var(--accent);border:1px solid #447b70;padding:5px 9px;border-radius:30px;font-size:11px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:17px;margin:0 0 12px}.card.feature{background:#213c3d;border-color:#427b70}.small{font-size:12px}.tiny{font-size:11px}.muted{color:var(--muted)}.accent{color:var(--accent)}.big{font-size:26px;font-weight:850;line-height:1.35}.section{font-size:17px;font-weight:850;margin:22px 0 10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid3 .card{text-align:center;padding:12px 5px}.grid3 .big{font-size:19px}.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}.note{background:var(--panel2);border-radius:11px;padding:12px;font-size:13px;margin-top:9px}.note.alert{background:#513d3d;color:#ffdddd}.foot{font-size:11px;color:var(--muted);margin-top:9px}.rowline{padding:11px 0;border-bottom:1px solid var(--line)}.rowline:last-child{border:0}.tag{font-size:11px;font-weight:700;color:#b9f2e4;background:#2c4e49;padding:3px 7px;border-radius:6px}.tag.off{background:#34404a;color:#b2bfca}
h1,h2,h3,p{margin:0}p+p{margin-top:9px}a{color:var(--accent)}.btn{display:block;text-align:center;border:0;border-radius:11px;background:var(--accent);color:#102923;padding:12px 16px;font-weight:800;cursor:pointer}.btn.full{width:100%;margin-top:10px}.btn.sub{background:#2e434f;border:1px solid #526a73;color:var(--text)}.btn.danger{background:#50383d;color:#ffdbdb}
.tabbar{position:fixed;z-index:9;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(14,23,29,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}.tabbar button{max-width:160px;flex:1;background:none;border:0;color:var(--muted);padding:12px 2px 10px;font-size:12px}.tabbar button.on{color:var(--accent);font-weight:850}.tabbar b{display:block;font-size:20px;line-height:1.2}
label{display:block;margin:12px 0 5px;font-size:12px;color:var(--muted)}input,select{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;background:#101e26;border:1px solid #50636c;border-radius:10px;padding:11px 10px;color:var(--text);font-size:16px;outline:none}input:focus{border-color:var(--accent)}input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;min-height:46px;color-scheme:dark}input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.formrow{min-width:0;overflow:hidden}.choice{display:flex;gap:7px}.choice label{margin:0;flex:1;min-width:0;color:var(--text);border:1px solid #53636e;border-radius:10px;padding:11px 6px;text-align:center;cursor:pointer;font-size:12px}.choice input{position:absolute;opacity:0;height:1px;width:1px}.choice label:has(input:checked){background:#335f55;border-color:var(--accent);color:#e2fff3}
.chart{width:100%;height:auto;display:block;margin-top:8px}.chart text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:10px;fill:#aabdca}.chart .grid{stroke:#44545e;stroke-dasharray:3 4;stroke-width:.7}.empty{font-size:13px;color:var(--muted);padding:15px 0}@media(max-width:355px){.wrap{padding-left:12px;padding-right:12px}.card{padding:13px}.brand{font-size:18px}.grid3 .big{font-size:16px}}
</style></head><body><div id="root"></div><div id="nav" class="tabbar"></div>
<script>
(()=>{'use strict';
const KEY='nagoya-run-mvp-v1',RACE='2027-03-14',RACE_KM=21.0975;
const $=s=>document.querySelector(s),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dt=s=>new Date(s+'T12:00:00'),today=()=>iso(new Date()),shift=(s,n)=>{let d=dt(s);d.setDate(d.getDate()+n);return iso(d)},days=(a,b)=>Math.round((dt(b)-dt(a))/86400000),weekStart=s=>{let d=dt(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n).toFixed(1),pace=s=>!Number.isFinite(s)||s<=0?'—':`${Math.floor(Math.round(s)/60)}:${String(Math.round(s)%60).padStart(2,'0')}`,dateLabel=s=>`${dt(s).getMonth()+1}/${dt(s).getDate()}`;
let data,error=false,tab='home',editing=today();try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):{records:{}};if(!data||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error('invalid')}catch(e){data={records:{}};error=true}
function records(){return Object.entries(data.records).filter(([d,r])=>d<=today()&&r&&!r.rest&&Number(r.km)>0&&Number(r.minutes)>0).sort((a,b)=>a[0].localeCompare(b[0]))}
function recent(n){return records().filter(([d])=>d>=shift(today(),1-n))}
function totalKm(a){return a.reduce((n,[,r])=>n+Number(r.km),0)}
function maxKm(a){return Math.max(0,...a.map(([,r])=>Number(r.km)))}
function effort(r){if([1,2,3].includes(Number(r.effort)))return Number(r.effort);return Number(r.fatigue)>=4?3:Number(r.fatigue)===3?2:1}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存に失敗。iPhoneのサイトデータと空き容量を確認してね。');return false}}
function raceLeft(){return Math.max(0,days(today(),RACE))}
function level(){const all=records(),a14=recent(14),a28=recent(28),a42=recent(42),far=maxKm(a42),long=Math.max(0,...a42.map(([,r])=>Number(r.minutes)));const stages=[
['準備中','まず運動の記録を1回つける',()=>true],
['はじめの一歩','運動を1回記録する',()=>all.length>=1],
['習慣の土台','直近14日で3回運動する',()=>a14.length>=3],
['30分の土台','直近42日に30分以上の記録があり、直近14日で3回',()=>long>=30&&a14.length>=3],
['5kmへの到達','直近42日に5km以上、直近28日で4回',()=>far>=5&&a28.length>=4],
['8kmへの到達','直近42日に8km以上、同期間に5回',()=>far>=8&&a42.length>=5],
['10kmへの到達','直近42日に10km以上、同期間に6回',()=>far>=10&&a42.length>=6],
['14kmへの到達','直近42日に14km以上、同期間に7回',()=>far>=14&&a42.length>=7],
['16kmへの到達','直近42日に16km以上、同期間に8回',()=>far>=16&&a42.length>=8]];
let idx=0;for(let i=1;i<stages.length;i++){if(!stages[i][2]())break;idx=i}return {idx,stages,a14,a28,a42,far};}
function milestone(lv){return ['まだ走力は未評価。まず運動の記録から。','最初の一歩。完走に必要な持久力はこれから。','練習を続ける土台づくりが進んでいる段階。','30分動く土台を確認。長距離耐性はまだ別の課題。','5kmはハーフ距離の約24%。時間内完走はまだ判定できない。','8kmはハーフ距離の約38%。今後も安全な積み上げが必要。','10kmはハーフ距離の約47%。後半の持久力と関門は未評価。','14kmはハーフ距離の約66%。後半と時間制限への備えが必要。','16kmはハーフ距離の約76%。十分な体調管理と本番の関門確認が必要。'][lv]||'参考段階'}
function period(){const d=raceLeft();return d===0?['大会当日','追加練習はせず、体調・天候と大会案内を確認しよう。']:d<=21?['調整期','直前の無理な距離増加は避けて、疲れを残さないことを優先。']:d<=60?['持久力の安定期','これまでの練習を継続し、長い距離は体調と実績で判断しよう。']:['基礎づくり期','まず楽な強さで続けられる30分と、適切な休息を目指そう。']}
function workout(){let a=records(),last=a.at(-1),lv=level().idx,d=raceLeft();if(d===0)return ['大会当日・大会後','新しい練習を追加せず、体調と大会案内を優先。','大会日を迎えたため'];if(!last)return ['ゆっくり走る1分＋歩く90秒 ×7','最初と最後に5分歩く。走るのがつらければ歩く時間を増やしてOK。','最初は低負荷の走歩交互から始めるため'];let [day,r]=last,ago=days(day,today());if(r.pain==='yes')return ['今日は休養を優先','痛み・違和感が残る間は走らないでね。強い痛み・腫れ・長引く症状は医療者に相談を。','直近に痛み・違和感の記録があるため'];if(ago<=1)return ['休養か軽い散歩','少なくとも次のランニングまで1日は間隔を空けよう。疲れていればさらに休んでOK。',`前回の運動から${ago}日で、回復を優先するため`];if(effort(r)===3)return ['回復を確認して短い運動から','疲労が残るなら休もう。回復したら走歩交互で15〜20分程度から。','直近の運動がかなりきつかったため'];if(ago>=14)return ['走歩交互で15〜20分','以前の最長距離を急に再現しないでね。まずは再スタート。','前回から2週間以上経っているため'];if(r.mode==='walk'&&lv<=3)return ['歩行中心＋短いジョグで20分','歩く時間を中心に、問題なければ1分だけゆっくり走る区間を数回入れてみよう。','直近の運動がウォーキングだったため'];if(lv<=2)return ['走歩交互で20〜30分','会話できる強さで、走る＋歩くを交互に繰り返そう。','運動時間と継続の土台を作るため'];if(lv===3)return ['楽な強さで30分','途中で歩いてもOK。ペースよりも無理なく繰り返せることが大切。','30分の活動を安定させる段階だから'];if(lv<=5)return ['楽な強さで30〜40分','疲労が少ない週に、1回だけ少し長めに。急な距離増加は避けよう。','5〜8kmの経験を持久力につなげるため'];return ['楽な強さで40〜50分','長めの運動は週1回まで。距離を増やす前に痛みと回復を確認しよう。','距離の実績ができたため、反復と回復を重視'];}
function advice(){const all=records(),a14=recent(14),last=all.at(-1),out=[];if(!last)return ['最初の9週間は、走る＋歩くの組み合わせから少しずつ走る時間を増やす考え方が基本。','運動の間には休養日を設けてね。'];let [d,r]=last,ago=days(d,today());if(r.pain==='yes')out.push('痛み・違和感を報告しているため、距離とペースより回復を優先してね。');else if(effort(r)===3)out.push('最後の運動はかなりきつかったね。次回は歩く区間を増やすか、時間を短縮しよう。');else out.push('速く走るより、楽な強さで同じ負荷を繰り返せるかを確認しよう。');if(ago>=7)out.push(`${ago}日間隔が空いているよ。以前の距離に戻そうとせず、短い練習から再開しよう。`);if(a14.length<2)out.push(`直近14日で${a14.length}回。週2〜3回を目安に、運動の間に休養を入れてみよう。`);else if(a14.length>7)out.push(`直近14日で${a14.length}回。疲労を溜めないよう、休養の時間を確保してね。`);else out.push(`直近14日で${a14.length}回。いまの頻度を維持し、余裕があるときだけ少しずつ時間を調整しよう。`);if(all.length>=2){let p=all.at(-2)[1],q=last[1],k1=Number(p.km),k2=Number(q.km);if(Math.abs(k1-k2)/Math.max(k1,k2)<=.15){let a=Number(p.minutes)*60/k1,b=Number(q.minutes)*60/k2;if(b>a+15)out.push('同程度の距離で前回よりゆっくり。疲労や気温による変化もあるため、無理に取り戻す必要はないよ。');else if(b<a-15)out.push('同程度の距離で前回より速いけれど、最優先は安定して走れることだよ。')}}if(raceLeft()<=21)out.push('大会直前は新しい長距離練習を詰め込まず、体調を整えよう。');return out.slice(0,5)}
function shell(title,html){$('#root').innerHTML=`<main class="wrap"><header class="top"><div><div class="eyebrow">ROAD TO NAGOYA 2027</div><div class="brand">${esc(title)}</div></div><span class="pill">3.14 SUN</span></header>${error?'<div class="note alert">保存データを読み込めなかったため、ブラウザの保存状態を確認してね。</div>':''}${html}</main>`;const tabs=[['home','⌂','ホーム'],['plan','◎','練習'],['record','＋','記録'],['analysis','▥','分析']];$('#nav').innerHTML=tabs.map(([id,icon,label])=>`<button data-tab="${id}" type="button" class="${tab===id?'on':''}"><b>${icon}</b>${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function home(){const l=level(),p=period(),w=workout(),a=records().filter(([d])=>d>=weekStart(today()));shell('完走までの伴走',`
<div class="card"><div class="spread"><span class="small muted">名古屋シティマラソン2027</span><span class="small accent">21.0975km / 制限3時間</span></div><div class="big">あと ${raceLeft()} 日</div><p class="foot">${p[0]} · ${p[1]}</p></div>
<div class="card feature"><div class="small accent">次におすすめの行動</div><div class="big" style="font-size:21px;margin-top:6px">${esc(w[0])}</div><p style="margin-top:9px">${esc(w[1])}</p><p class="foot">理由：${esc(w[2])}</p><button id="showPlan" class="btn full">練習の詳細を見る →</button></div>
<div class="grid3"><div class="card"><div class="small muted">今週の距離</div><div class="big">${num(totalKm(a))}<span class="small">km</span></div></div><div class="card"><div class="small muted">今週の回数</div><div class="big">${a.length}<span class="small">回</span></div></div><div class="card"><div class="small muted">直近最長</div><div class="big">${num(l.far)}<span class="small">km</span></div></div></div>
<div class="card"><div class="small accent">現在の到達段階</div><div class="big">Lv.${l.idx} <span style="font-size:16px">${esc(l.stages[l.idx][0])}</span></div><p class="note">${l.idx<8?`次：Lv.${l.idx+1} ${esc(l.stages[l.idx+1][0])} — ${esc(l.stages[l.idx+1][1])}`:'判定上の最終段階。ただし完走の保証ではないよ。'}</p><p class="note">ハーフマラソン的には：${esc(milestone(l.idx))}</p><p class="foot">直近42日間を中心とする距離・時間・継続性で評価。走歩を含む活動の到達基準で、完走確率ではないよ。</p></div>
<h2 class="section">ぽんの伴走コメント</h2><div class="card">${advice().map(t=>`<p class="note">${esc(t)}</p>`).join('')}</div><button class="btn full" id="quickRecord">今日の記録を入力する</button>`);$('#showPlan').onclick=()=>{tab='plan';render()};$('#quickRecord').onclick=()=>{editing=today();tab='record';render()}}
function planPage(){const l=level(),w=workout(),p=period();shell('完走への練習',`
<div class="card feature"><div class="small accent">いまの練習フェーズ</div><div class="big" style="font-size:21px">${esc(p[0])}</div><p>${esc(p[1])}</p><p class="foot">大会まで約${Math.ceil(raceLeft()/7)}週間</p></div>
<h2 class="section">完走までの練習ロードマップ</h2><div class="card"><div class="rowline"><b>最初の約9週間｜走る・歩くの土台</b><p class="small muted">走歩交互から始め、楽な強さで30分ほど運動できる状態を目指す。NHSの初心者向け9週間プログラムを参考にする。</p></div><div class="rowline"><b>次の約8〜9週間｜持久力を育てる</b><p class="small muted">週2〜3回の楽な練習を維持し、回復できる範囲で1回の運動時間を少しずつ延ばす。10km以上の経験は徐々に、無理な場合は距離を追わない。</p></div><div class="rowline"><b>大会前の約2〜3週間｜疲労を抜く</b><p class="small muted">新しい長距離挑戦を避け、運動量を落として体調を整える。</p></div><p class="foot">今日から始める場合の一般的な約20〜21週間モデル。実際は現在の走力・体調・残り期間に応じて調整するため、画面上の次回メニューを優先してね。</p></div>
<h2 class="section">次に取り組むメニュー</h2><div class="card"><b>${esc(w[0])}</b><p class="note">${esc(w[1])}</p><p class="foot">提案理由：${esc(w[2])}</p></div>
<h2 class="section">1週間の練習イメージ</h2><div class="card"><div class="rowline"><b>1回目｜楽な運動</b><p class="small muted">会話できる強さで、走る・歩くを組み合わせよう。${l.idx<=3?'まず20〜30分が目安。':'30〜40分が目安。'}</p></div><div class="rowline"><b>2回目｜同じ負荷を再現</b><p class="small muted">前回の疲れが抜けてから。ペースを上げずに同じ強さで。</p></div><div class="rowline"><b>3回目｜余裕があれば少し長く</b><p class="small muted">直近の時間と疲労を参考に徐々に。無理な週は2回だけでもOK。</p></div><p class="foot">英国NHSのCouch to 5Kの走歩交互・週3回・練習間の休養を参考にした一般的な方針。痛みがあれば中止してね。</p></div>
<h2 class="section">レベルの明確な基準</h2><div class="card"><div class="small muted">現在 Lv.${l.idx}　${esc(l.stages[l.idx][0])}</div><p class="note">ハーフマラソンとの関係：${esc(milestone(l.idx))}</p>${l.stages.slice(1).map((stage,i)=>`<div class="rowline spread"><div><b>Lv.${i+1} ${esc(stage[0])}</b><div class="small muted">${esc(stage[1])}</div></div><span class="tag ${i+1>l.idx?'off':''}">${i+1<=l.idx?'達成':'未達'}</span></div>`).join('')}<p class="foot">過去1回の最高記録だけでは上位レベルにならない設計。休養後は現在レベルが変化する場合があるよ。</p></div>
<div class="card"><b>本番の注意</b><p class="note">名古屋ハーフは21.0975km、号砲から3時間制限。途中関門もあり、距離の達成と関門時間内の完走は別の課題だよ。</p><a href="https://city-marathon.nagoya/outline/general/" target="_blank" rel="noopener noreferrer">大会公式の開催概要を見る ↗</a></div>`)}
function recordPage(){const r=data.records[editing]||{},e=r.effort??(r.fatigue?effort(r):2),mode=r.mode||'run_walk';shell('運動を記録',`
<div class="card"><form id="recordForm"><div class="formrow"><label for="day">日付</label><input id="day" type="date" name="day" max="${today()}" value="${esc(editing)}" required></div><div class="two"><div class="formrow"><label for="km">距離（km）</label><input id="km" type="number" name="km" min="0.01" max="200" step="0.01" inputmode="decimal" value="${esc(r.rest?'':r.km??'')}" required></div><div class="formrow"><label for="mins">時間（分）</label><input id="mins" type="number" name="mins" min="0.1" max="1000" step="0.1" inputmode="decimal" value="${esc(r.rest?'':r.minutes??'')}" required></div></div>
<label>運動の種類</label><div class="choice">${[['run_walk','走る＋歩く'],['run','ランニング'],['walk','ウォーキング']].map(([v,n])=>`<label><input type="radio" name="mode" value="${v}" ${mode===v?'checked':''}>${n}</label>`).join('')}</div>
<label>運動後の感覚</label><div class="choice">${[[1,'余裕あり'],[2,'ちょうどいい'],[3,'かなりきつい']].map(([v,n])=>`<label><input type="radio" name="effort" value="${v}" ${Number(e)===v?'checked':''}>${n}</label>`).join('')}</div>
<label>痛み・違和感</label><div class="choice">${[['no','なし'],['yes','あり']].map(([v,n])=>`<label><input type="radio" name="pain" value="${v}" ${(r.pain||'no')===v?'checked':''}>${n}</label>`).join('')}</div>
<p class="foot">平均ペースは自動計算。「一言」欄は廃止。運動の種類・負荷・痛みは次の練習提案に使うよ。</p><button class="btn full" type="submit">記録して分析を更新</button></form><button id="todayBtn" class="btn sub full">今日の日付へ</button><button id="deleteBtn" class="btn danger full">この日の記録を削除</button></div>
<h2 class="section">最近の記録</h2><div class="card">${records().slice(-7).reverse().map(([d,r])=>`<div class="rowline spread"><div><b>${dateLabel(d)}</b><div class="small muted">${num(r.km)}km ・ ${Number(r.minutes)}分 ・ ${pace(Number(r.minutes)*60/Number(r.km))}/km</div></div><button data-edit="${esc(d)}" class="btn sub">編集</button></div>`).join('')||'<div class="empty">まだ記録がないよ。</div>'}</div><p class="foot">保存先はこれまでと同じ端末内。SafariのWebサイトデータ削除などで失われる場合があるため注意してね。</p>`);
const f=$('#recordForm');f.elements.day.onchange=()=>{const d=f.elements.day.value;if(d&&d<=today()){editing=d;render()}else f.elements.day.value=editing};f.onsubmit=ev=>{ev.preventDefault();const x=Number(f.elements.km.value),m=Number(f.elements.mins.value);if(!(x>0&&x<=200&&m>0&&m<=1000))return alert('距離・時間を正しく入力してね。');if(m*60/x<120)return alert('2分/kmより速いペースになっているよ。入力値を確認してね。');data.records[editing]={...data.records[editing],km:x,minutes:m,mode:f.elements.mode.value,effort:Number(f.elements.effort.value),pain:f.elements.pain.value,rest:false};if(save()){alert('保存したよ。次の提案にも反映したよ！');tab='home';render()}};$('#todayBtn').onclick=()=>{editing=today();render()};$('#deleteBtn').onclick=()=>{if(!data.records[editing])return alert('この日の記録はないよ。');if(confirm('この日の記録を削除する？')){delete data.records[editing];if(save())render()}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render()})}
function chart(type){const dates=Array.from({length:14},(_,i)=>shift(today(),i-13)),rs=dates.map(d=>{const r=data.records[d];return {d,v:r&&!r.rest&&r.km>0&&r.minutes>0?(type==='km'?Number(r.km):Number(r.minutes)*60/Number(r.km)):null}}),vs=rs.filter(r=>r.v!==null).map(r=>r.v);if(!vs.length)return '<div class="empty">直近14日間のデータが入るとグラフが出るよ。</div>';const W=340,H=190,L=38,T=12,B=158,RIGHT=11,X=i=>L+i*(W-L-RIGHT)/13,MAX=type==='km'?Math.max(2,Math.ceil(Math.max(...vs)*1.15)):Math.max(480,Math.ceil(Math.max(...vs)*1.1/60)*60),Y=v=>B-v/MAX*(B-T);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="過去14日間の${type==='km'?'距離':'平均ペース'}グラフ">`;for(let i=0;i<=3;i++){let n=MAX*i/3,y=Y(n);s+=`<line class="grid" x1="${L}" x2="${W-RIGHT}" y1="${y}" y2="${y}"/><text x="${L-5}" y="${y+4}" text-anchor="end">${type==='km'?n.toFixed(0):pace(n)}</text>`}if(type==='km'){rs.forEach((r,i)=>{if(r.v===null)return;let y=Y(r.v);s+=`<rect x="${X(i)-7}" y="${y}" width="14" height="${Math.max(2,B-y)}" rx="3" fill="#79ddc4"><title>${r.d} ${num(r.v)}km</title></rect>`})}else{let prev=null;rs.forEach((r,i)=>{if(r.v===null){prev=null;return}let pt=[X(i),Y(r.v)];if(prev)s+=`<line x1="${prev[0]}" y1="${prev[1]}" x2="${pt[0]}" y2="${pt[1]}" stroke="#79ddc4" stroke-width="2"/>`;s+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="4.5" fill="#79ddc4"><title>${r.d} ${pace(r.v)}/km</title></circle>`;prev=pt})}rs.forEach((r,i)=>{if(i%3===1||i===13)s+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle">${dateLabel(r.d)}</text>`});return s+'</svg>'}
function analysisPage(){let all=records(),a14=recent(14),a28=recent(28),last=all.at(-1),m=all.reduce((n,[,r])=>n+Number(r.minutes),0);shell('記録と分析',`
<div class="grid3"><div class="card"><div class="small muted">累計距離</div><div class="big">${num(totalKm(all))}<span class="small">km</span></div></div><div class="card"><div class="small muted">過去14日</div><div class="big">${num(totalKm(a14))}<span class="small">km</span></div></div><div class="card"><div class="small muted">最長距離</div><div class="big">${num(maxKm(all))}<span class="small">km</span></div></div></div>
<div class="card"><b>日別の距離</b><p class="small muted">直近14日（km）</p>${chart('km')}</div><div class="card"><b>日別の平均ペース</b><p class="small muted">直近14日（分:秒/km）</p>${chart('pace')}<p class="foot">縦軸は上ほど遅く、下ほど速い値。距離や運動種類が異なるため単純比較に注意してね。</p></div>
<div class="card"><b>練習の状態</b><div class="rowline">直近14日の運動：<b>${a14.length}回</b></div><div class="rowline">直近28日の運動：<b>${a28.length}回</b></div><div class="rowline">最新ペース：<b>${last?pace(Number(last[1].minutes)*60/Number(last[1].km)):'—'}/km</b></div><div class="rowline">総運動時間：<b>${Math.round(m)}分</b></div></div>
<h2 class="section">次につながる分析</h2><div class="card">${advice().map(t=>`<p class="note">${esc(t)}</p>`).join('')}<p class="note"><b>次のおすすめ：</b>${esc(workout()[0])}</p><button class="btn full" id="goPlan">練習メニューを見る →</button></div><p class="foot">レベルと提案は一般的な指標で、医療上の判断・完走の保証ではないよ。</p>`);$('#goPlan').onclick=()=>{tab='plan';render()}}
function render(){if(tab==='home')home();else if(tab==='plan')planPage();else if(tab==='record')recordPage();else analysisPage()}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
