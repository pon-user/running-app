</style></head><body><div id="root"></div><nav id="nav" class="tabbar" aria-label="メインメニュー"></nav><script>(()=>{'use strict';
const KEY='nagoya-run-mvp-v1',RACE='2027-03-14',RACE_KM=21.0975,VERSION='0.6';
const $=q=>document.querySelector(q);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const asDate=s=>new Date(s+'T12:00:00');
const today=()=>iso(new Date());
const shift=(s,n)=>{let d=asDate(s);d.setDate(d.getDate()+n);return iso(d)};
const days=(from,to)=>Math.round((asDate(to)-asDate(from))/86400000);
const weekStart=s=>{let d=asDate(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const dateLabel=s=>{const d=asDate(s);return `${d.getMonth()+1}/${d.getDate()}`};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toFixed(1);
const exactKm=n=>Number(n||0).toFixed(2);
const pace=s=>!Number.isFinite(s)||s<=0?'—':`${Math.floor(Math.round(s)/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;
const formatHours=minutes=>{const rounded=Math.round(minutes);return `${Math.floor(rounded/60)}時間${rounded%60}分`};
// Keep the original numeric-minute data model (e.g. 60.483333), display mm:ss.
const formatDuration=minutes=>{if(minutes===''||minutes==null||!Number.isFinite(+minutes))return '';const n=Math.round(Number(minutes)*60);return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`};
// Numeric keypad input: 6030 -> 60:30, 12000 -> 120:00. The colon is inserted from 3 digits.
function durationMask(value){
 const text=String(value??'').normalize('NFKC').trim();
 const hms=text.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
 if(hms){const seconds=(+hms[1]*60+ +hms[2])*60+ +hms[3];return formatDuration(seconds/60)}
 const digits=text.replace(/\D/g,'').slice(0,6);
 return digits.length<=2?digits:`${digits.slice(0,-2)}:${digits.slice(-2)}`;
}
function parseDuration(value){
 const text=String(value??'').trim();
 if(!text)return null;
 const match=text.match(/^(\d{1,4}):(\d{1,2})$/);
 const raw=text.match(/^\d{1,2}$/);
 if(!match&&!raw)return null;
 const min=match?Number(match[1]):0,sec=match?Number(match[2]):Number(text);
 if(!Number.isInteger(min)||!Number.isInteger(sec)||sec<0||sec>=60||min<0||min>1000||(min===1000&&sec!==0))return null;
 const sum=min+sec/60;return sum>0?sum:null;
}
function hasHeart(r){const min=Number(r.hrMin),avg=Number(r.hrAvg),max=Number(r.hrMax);return r.hrMin!=null&&r.hrAvg!=null&&r.hrMax!=null&&Number.isInteger(min)&&Number.isInteger(avg)&&Number.isInteger(max)&&min>=30&&max<=250&&min<=avg&&avg<=max}
const median=arr=>{if(!arr.length)return null;const a=[...arr].sort((x,y)=>x-y);return a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2};
const safeDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(asDate(s).getTime());
const INITIAL=()=>({records:{},checkins:{},progress:{maxLevel:0}});
let data,storageError=false,tab='home',editing=today(),analysisRange='all',showAllHistory=false;
try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):INITIAL();if(!data||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error('invalid');if(!data.checkins||typeof data.checkins!=='object'||Array.isArray(data.checkins))data.checkins={};if(!data.progress||typeof data.progress!=='object')data.progress={maxLevel:0}}
catch(e){data=INITIAL();storageError=true}
function records(){return Object.entries(data.records).filter(([d,r])=>safeDate(d)&&d<=today()&&r&&!r.rest&&Number.isFinite(+r.km)&&Number.isFinite(+r.minutes)&&+r.km>0&&+r.minutes>0).sort((a,b)=>a[0].localeCompare(b[0]));}
function isWalk(r){return r.mode==='walk'}
// Legacy records without a mode field are treated as run/walk, never deleted.
function trainingRecords(){return records().filter(([,r])=>!isWalk(r))}

function activityKind(r){return isWalk(r)?'ウォーキング':r.mode==='run'?'ランニング':'走る＋歩く'}
function rangeRecords(n,anchor=today()){const from=shift(anchor,1-n);return records().filter(([d])=>d>=from&&d<=anchor)}
function totalKm(es){return es.reduce((s,[,r])=>s+Number(r.km),0)}
function totalMinutes(es){return es.reduce((s,[,r])=>s+Number(r.minutes),0)}
function bestKm(es){return Math.max(0,...es.map(([,r])=>Number(r.km)))}
function paceOf(r){return Number(r.minutes)*60/Number(r.km)}
function sessionEffort(r){if([1,2,3].includes(Number(r.effort)))return Number(r.effort);if(r.fatigue!=null)return Number(r.fatigue)>=4?3:Number(r.fatigue)===1?1:2;return null}
function safeToPromote(r){return r.pain!=='yes'&&r.symptoms!=='alert'&&sessionEffort(r)!==3}
function countWhere(es,fn){return es.reduce((n,p)=>n+(fn(p[1],p[0])?1:0),0)}
function raceLeft(){return Math.max(0,days(today(),RACE))}
function save(){if(storageError){alert('古い記録を読めなかったため保存を停止しているよ。サイトの保存状態を確認してね。');return false}try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('記録の保存に失敗。端末の空き容量とSafariのサイト設定を確認してね。');return false}}

// The ONE source of truth for level progression, roadmap, and level-specific training.
// Each gate is an operational design threshold, not a medically validated fitness test.
// A single milestone table drives earned levels, road map, period targets, and training.
// Thresholds are pragmatic in-app design choices, not validated physiological standards.
const LEVELS=[
 {lv:0,name:'スタート準備',phase:'準備',dueWeeks:22,condition:'記録前',meaning:'運動を少しずつ始める',training:[15,20,25],focus:'短い走歩を無理なく開始する。',check:()=>true},
 {lv:1,name:'まず20分',phase:'走歩の土台',dueWeeks:20,condition:'20分以上の走歩またはランニングを1回',meaning:'運動を始める段階',training:[20,20,30],focus:'走歩で20分を反復する。',check:e=>countWhere(e,r=>+r.minutes>=20)>=1},
 {lv:2,name:'2週間の習慣',phase:'走歩の土台',dueWeeks:18,condition:'14日間で3回の走歩・ランニング',meaning:'反復できる練習習慣の獲得',training:[20,25,30],focus:'間に休養を挟んで週2〜3回を安定させる。',check:e=>e.filter(([d])=>d>=shift(e.at(-1)[0],-13)).length>=3},
 {lv:3,name:'楽な30分',phase:'走歩の土台',dueWeeks:16,condition:'21日間で楽な30分を2回、14日間で3回',meaning:'30分を繰り返せる基礎',training:[25,30,40],focus:'会話できる強さを優先し、歩きを混ぜてもよい。',check:e=>{const d=e.at(-1)[0];return countWhere(e.filter(([x])=>x>=shift(d,-20)),r=>+r.minutes>=30&&safeToPromote(r))>=2&&e.filter(([x])=>x>=shift(d,-13)).length>=3}},
 {lv:4,name:'5kmを安定',phase:'距離の安定',dueWeeks:14,condition:'42日間に楽な5kmを2回、28日間で4回',meaning:'5kmを繰り返す経験',training:[30,35,55],focus:'楽な5kmを反復し、週1回の少し長い練習を用意する。',check:e=>{const d=e.at(-1)[0];return countWhere(e.filter(([x])=>x>=shift(d,-41)),r=>+r.km>=5&&safeToPromote(r))>=2&&e.filter(([x])=>x>=shift(d,-27)).length>=4}},
 {lv:5,name:'8kmに対応',phase:'持久力育成',dueWeeks:12,condition:'56日間に楽な8kmを1回、42日間に5回',meaning:'長めの距離への適応',training:[30,40,75],focus:'楽な短い練習を維持しながら、週1回だけ長くする。',check:e=>{const d=e.at(-1)[0];return countWhere(e.filter(([x])=>x>=shift(d,-55)),r=>+r.km>=8&&safeToPromote(r))>=1&&e.filter(([x])=>x>=shift(d,-41)).length>=5}},
 {lv:6,name:'10kmの土台',phase:'持久力育成',dueWeeks:10,condition:'56日間に楽な10kmを1回、計6回',meaning:'ハーフ距離の半分近くを経験',training:[35,45,95],focus:'長めの練習の翌日は疲労回復を優先する。',check:e=>{const d=e.at(-1)[0],k=e.filter(([x])=>x>=shift(d,-55));return countWhere(k,r=>+r.km>=10&&safeToPromote(r))>=1&&k.length>=6}},
 {lv:7,name:'13kmの持久力',phase:'持久力育成',dueWeeks:8,condition:'70日間に楽な13kmを1回、計8回',meaning:'長時間移動への適応を確認',training:[40,45,120],focus:'長距離のあとの回復と、平日の短い練習を重視する。',check:e=>{const d=e.at(-1)[0],k=e.filter(([x])=>x>=shift(d,-69));return countWhere(k,r=>+r.km>=13&&safeToPromote(r))>=1&&k.length>=8}},
 {lv:8,name:'16kmの持久力',phase:'距離と関門',dueWeeks:6,condition:'70日間に楽な16kmを1回、計10回',meaning:'本番に向けた長距離経験',training:[40,50,150],focus:'長距離の反復を急がず、関門ペースを別に確認する。',check:e=>{const d=e.at(-1)[0],k=e.filter(([x])=>x>=shift(d,-69));return countWhere(k,r=>+r.km>=16&&safeToPromote(r))>=1&&k.length>=10}},
 {lv:9,name:'関門ペースを確認',phase:'距離と関門',dueWeeks:4,condition:'70日間に16km以上1回＋10kmを7:45/km以内で1回',meaning:'距離に加えペースの根拠を確保',training:[40,50,145],focus:'楽なラン中心。痛みがなく十分な土台がある場合に限り、短いペース確認を行う。',check:e=>{const d=e.at(-1)[0],k=e.filter(([x])=>x>=shift(d,-69));return countWhere(k,r=>+r.km>=16&&safeToPromote(r))>=1&&countWhere(k,r=>+r.km>=10&&paceOf(r)<=465&&safeToPromote(r))>=1}},
 {lv:10,name:'余裕ある完走へ',phase:'大会へ調整',dueWeeks:2,condition:'70日間に16kmを7:35/km以内1回＋10kmを7:20/km以内2回',meaning:'余裕ある関門通過を狙う参考実績。ただし保証ではない',training:[30,40,90],focus:'直前は距離を増やさず回復と調整を優先する。',check:e=>{const d=e.at(-1)[0],k=e.filter(([x])=>x>=shift(d,-69));return countWhere(k,r=>+r.km>=16&&paceOf(r)<=455&&safeToPromote(r))>=1&&countWhere(k,r=>+r.km>=10&&paceOf(r)<=440&&safeToPromote(r))>=2}}
];

function progressState(){
 const es=trainingRecords(),earnedDates=Array(LEVELS.length).fill(null);let lv=0;
 // Persist the highest demonstrably reached level, but recompute after edits/deletions.
 for(let i=0;i<es.length;i++){
  const prefix=es.slice(0,i+1);
  for(let j=lv+1;j<LEVELS.length;j++){if(!LEVELS[j].check(prefix))break;lv=j;earnedDates[j]=es[i][0]}
 }
 // Effective training stage is inferred from recent evidence, not the historical badge.
 const recent=es.filter(([d])=>d>=shift(today(),-69)),last=es.at(-1),ago=last?days(last[0],today()):Infinity;
 let current=0;
 for(let j=1;j<LEVELS.length;j++){if(!recent.length||!LEVELS[j].check(recent))break;current=j}
 if(ago>=28)current=0;
 else if(ago>=14)current=Math.min(current,1);
 else if(ago>=7)current=Math.min(current,Math.max(1,lv-3));
 // After a long gap do not immediately jump back to a previously high stage.
 let recentGapIndex=-1;
 for(let i=1;i<es.length;i++)if(days(es[i-1][0],es[i][0])>=21)recentGapIndex=i;
 const restartCount=recentGapIndex<0?Infinity:es.length-recentGapIndex;
 if(recentGapIndex>=0&&days(es[recentGapIndex][0],today())<42){
  if(restartCount<3)current=Math.min(current,2);
  else if(restartCount<6)current=Math.min(current,4);
  else if(restartCount<9)current=Math.min(current,6);
 }
 return {lv,stage:LEVELS[lv],next:LEVELS[lv+1]||null,current:Math.min(current,lv),currentStage:LEVELS[Math.min(current,lv)],earnedDates,es,last,ago,restartCount,restartActive:recentGapIndex>=0&&days(es[recentGapIndex][0],today())<42&&restartCount<9};
}
const clip=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
function abilityScores(){
 const es=trainingRecords(),r28=es.filter(([d])=>d>=shift(today(),-27)),r70=es.filter(([d])=>d>=shift(today(),-69));
 const safe=r70.filter(([,r])=>safeToPromote(r));
 const longest=bestKm(safe),longtime=Math.max(0,...safe.map(([,r])=>+r.minutes));

function summarize(period,all){
 if(period==='all')return all;
 const start=shift(today(),1-Number(period));return all.filter(([d])=>d>=start);
}
// Charts use fixed calendar ticks, never a separate label for every record.
// This keeps 14/30-day charts readable and also scales to many months or years.
const WALK_COLOR='#8dafff',RUN_COLOR='#79ddc4';
function trendGroups(items,scope){
 const span=items.length?days(items[0][0],today()):0;
 const unit=scope==='all'?(span>210?'month':span>35?'week':'day'):'day';
 const buckets=new Map();
 for(const [d,r] of items){
  const key=unit==='week'?weekStart(d):unit==='month'?d.slice(0,7)+'-01':d;
  const v=buckets.get(key)||{key,runKm:0,runMin:0,runCount:0,walkKm:0,walkMin:0,walkCount:0};
  if(isWalk(r)){v.walkKm+=Number(r.km);v.walkMin+=Number(r.minutes);v.walkCount++;}
  else{v.runKm+=Number(r.km);v.runMin+=Number(r.minutes);v.runCount++;}
  buckets.set(key,v);
 }
 const values=[...buckets.values()].sort((a,b)=>a.key.localeCompare(b.key));
 return {unit,values,groupByWeek:unit==='week',groupByMonth:unit==='month'};
}
function axisDomain(items,scope,unit){
 if(scope!=='all')return {start:shift(today(),1-Number(scope)),end:today()};
 if(!items.length)return {start:shift(today(),-13),end:today()};
 let start=unit==='week'?weekStart(items[0][0]):unit==='month'?items[0][0].slice(0,7)+'-01':items[0][0];
 let end=today();
 if(days(start,end)<7)start=shift(end,-7);
 return {start,end};
}
function axisLabels(start,end,unit){
 const span=Math.max(1,days(start,end));
 const count=span<22?3:span<95?4:5;
 const dates=Array.from({length:count},(_,i)=>shift(start,Math.round(i*span/(count-1))));
 const showYear=span>340;
 return dates.map((d,i)=>({d,label:showYear?d.slice(2,4)+'/'+dateLabel(d):dateLabel(d),anchor:i===0?'start':i===count-1?'end':'middle'}));
}
function svgTrend(items,scope,type){
 const {unit,values}=trendGroups(items,scope);
 if(!values.length)return '<div class="empty">この期間の記録はまだないよ。</div>';
 const W=354,H=206,L=44,R=13,T=17,B=163;
 const {start,end}=axisDomain(items,scope,unit),span=Math.max(1,days(start,end));
 const X=d=>L+Math.max(0,Math.min(1,days(start,d)/span))*(W-L-R);
 const isDistance=type==='km';
 const getVal=(v,walk)=>isDistance?(walk?v.walkKm:v.runKm):walk?(v.walkKm?v.walkMin*60/v.walkKm:null):(v.runKm?v.runMin*60/v.runKm:null);
 const allVal=values.flatMap(v=>[getVal(v,false),getVal(v,true)]).filter(v=>v!==null&&Number.isFinite(v));
 if(!allVal.length)return '<div class="empty">この期間に表示できる記録はないよ。</div>';
 const low=isDistance?0:Math.max(0,Math.floor((Math.min(...allVal)-45)/60)*60);
 const high=isDistance?Math.max(2,Math.ceil(Math.max(...allVal)*1.18)):Math.max(low+120,Math.ceil((Math.max(...allVal)+45)/60)*60);
 const Y=v=>B-(v-low)/(high-low)*(B-T);
 let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${isDistance?'距離':'ペース'}の推移。緑はランニング・走歩、青はウォーキング">`;
 for(let i=0;i<=3;i++){
  const v=low+(high-low)*i/3,y=Y(v);
  out+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${isDistance?num(v).replace(/\.0$/,''):pace(v)}</text>`;
 }
 if(isDistance){
  const binSpan=unit==='day'?Math.max(1,span):Math.max(1,values.length);
  const barWidth=Math.max(2,Math.min(15,(W-L-R)/binSpan*.58));
  for(const v of values){
   let center=X(v.key);
   // Side-by-side bars when a group contains both kinds of activity.
   const both=v.runKm>0&&v.walkKm>0;
   for(const [walk,km,color] of [[false,v.runKm,RUN_COLOR],[true,v.walkKm,WALK_COLOR]]){
    if(km<=0)continue;
    const width=both?barWidth*.48:barWidth;
    const px=center-(both?(walk?-0.02:-0.02):0)-width/2+(both?(walk?width*.55:-width*.55):0);
    const yy=Y(km);
    out+=`<rect x="${px}" y="${yy}" width="${width}" height="${Math.max(1,B-yy)}" rx="2" fill="${color}"><title>${v.key} ${walk?'ウォーキング':'ラン・走歩'} ${exactKm(km)}km</title></rect>`;
   }
  }
 }else{
  for(const [walk,color] of [[false,RUN_COLOR],[true,WALK_COLOR]]){
   const points=values.map(v=>({v:getVal(v,walk),d:v.key})).filter(p=>p.v!==null&&Number.isFinite(p.v));
   let prev=null;
   for(const pt of points){
    const x=X(pt.d),y=Y(pt.v);
    if(prev)out+=`<line x1="${prev.x}" x2="${x}" y1="${prev.y}" y2="${y}" stroke="${color}" stroke-width="2" ${walk?'stroke-dasharray="4 3"':''}/>`;
    out+=`<circle cx="${x}" cy="${y}" r="${points.length>35?2.5:4}" fill="${color}"><title>${pt.d} ${walk?'ウォーキング':'ラン・走歩'} ${pace(pt.v)}/km</title></circle>`;
    prev={x,y};
   }
  }
 }
 // Date labels come from evenly spaced calendar ticks, not activity dates.
 for(const tick of axisLabels(start,end,unit))out+=`<text x="${X(tick.d)}" y="${H-16}" text-anchor="${tick.anchor}">${tick.label}</text>`;
 out+='</svg>';
 const unitText=unit==='week'?'全期間は週単位':unit==='month'?'長期間の記録は月単位':'日単位';
 return out+`<p class="foot">${unitText}で表示。${isDistance?'緑と青の距離を区別。':'各区間の距離加重平均ペース。緑と青は別系列でつなぐ。'}</p>`;
}
function svgHeart(items,scope){
 const {unit}=trendGroups(items,scope),m=new Map();
 for(const [d,r] of items){if(!hasHeart(r))continue;
  const key=unit==='week'?weekStart(d):unit==='month'?d.slice(0,7)+'-01':d;
  const v=m.get(key)||{key,runSum:0,runMin:0,walkSum:0,walkMin:0,runLow:250,runHigh:0,walkLow:250,walkHigh:0};
  const walk=isWalk(r),weight=+r.minutes;
  if(walk){v.walkSum+= +r.hrAvg*weight;v.walkMin+=weight;v.walkLow=Math.min(v.walkLow,+r.hrMin);v.walkHigh=Math.max(v.walkHigh,+r.hrMax)}
  else{v.runSum+= +r.hrAvg*weight;v.runMin+=weight;v.runLow=Math.min(v.runLow,+r.hrMin);v.runHigh=Math.max(v.runHigh,+r.hrMax)}
  m.set(key,v);
 }
 const buckets=[...m.values()].sort((a,b)=>a.key.localeCompare(b.key));
 if(!buckets.length)return '<div class="empty">この期間の心拍データはまだないよ。記録時に平均・最小・最大を入力すると表示するよ。</div>';
 const allAvg=buckets.flatMap(v=>[v.runMin?v.runSum/v.runMin:null,v.walkMin?v.walkSum/v.walkMin:null]).filter(v=>v!==null);
 // The plotted series is the time-weighted average, not instantaneous extremes.
 const low=Math.max(30,Math.floor((Math.min(...allAvg)-12)/10)*10),high=Math.min(250,Math.max(low+30,Math.ceil((Math.max(...allAvg)+12)/10)*10));
 const W=354,H=204,L=40,R=13,T=17,B=162,{start,end}=axisDomain(items,scope,unit),span=Math.max(1,days(start,end));
 const X=d=>L+Math.max(0,Math.min(1,days(start,d)/span))*(W-L-R),Y=v=>B-(v-low)/(high-low)*(B-T);
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="平均心拍数の推移。緑はラン・走歩、青はウォーキング">`;
 for(let i=0;i<=3;i++){const v=low+(high-low)*i/3,y=Y(v);svg+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`}
 for(const [walk,color] of [[false,RUN_COLOR],[true,WALK_COLOR]]){
  const pts=buckets.filter(v=>walk?v.walkMin:v.runMin).map(v=>({day:v.key,value:walk?v.walkSum/v.walkMin:v.runSum/v.runMin,min:walk?v.walkLow:v.runLow,max:walk?v.walkHigh:v.runHigh}));
  let prev=null;
  for(const p of pts){const x=X(p.day),y=Y(p.value);
   if(prev)svg+=`<line x1="${prev.x}" y1="${prev.y}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="2" ${walk?'stroke-dasharray="4 4"':''}/>`;
   if(unit==='day'){const y1=Y(Math.min(high,p.max)),y2=Y(Math.max(low,p.min));svg+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="2" opacity=".42"/>`}
   svg+=`<circle cx="${x}" cy="${y}" r="${pts.length>28?2.8:4.2}" fill="${color}"><title>${p.day}：平均 ${Math.round(p.value)}bpm${unit==='day'?`（${p.min}〜${p.max}bpm）`:''}</title></circle>`;prev={x,y};
  }
 }
 for(const tick of axisLabels(start,end,unit))svg+=`<text x="${X(tick.d)}" y="${H-16}" text-anchor="${tick.anchor}">${tick.label}</text>`;
 svg+='</svg>';return svg+`<p class="foot">日別は平均点＋最小〜最大の細線。週・月別は運動時間による加重平均。ウォーキングとラン・走歩は混ぜない。</p>`;
}
function chartLegend(){return `<div class="chartlegend"><span><i style="background:${RUN_COLOR}"></i>ランニング＋走歩</span><span><i style="background:${WALK_COLOR}"></i>ウォーキング</span></div>`}
function cumulativeChart(all){
 if(!all.length)return '<div class="empty">まだ記録がないよ。</div>';
 let run=0,walk=0;
 let points=all.map(([d,r])=>{if(isWalk(r))walk+=Number(r.km);else run+=Number(r.km);return {date:d,run,walk}});
 const span=days(points[0].date,today());
 if(points.length>55){
  const unit=span>210?'month':'week',m=new Map();
  for(const p of points)m.set(unit==='week'?weekStart(p.date):p.date.slice(0,7),p);
  points=[...m.values()].sort((a,b)=>a.date.localeCompare(b.date));
 }
 const W=354,H=202,L=46,R=12,T=14,B=162;
 const {start,end}=axisDomain(all,'all','day'),domain=Math.max(1,days(start,end)),high=Math.max(2,Math.ceil(Math.max(run,walk)*1.12));
 const X=d=>L+Math.max(0,Math.min(1,days(start,d)/domain))*(W-L-R),Y=n=>B-n/high*(B-T);
 let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="累計のラン・走歩距離とウォーキング距離を色別に表示">`;
 for(let k=0;k<=3;k++){const v=high*k/3,y=Y(v);out+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`;}
 for(const [key,color] of [['run',RUN_COLOR],['walk',WALK_COLOR]]){
  for(let i=0;i<points.length;i++){
   const p=points[i],x=X(p.date),y=Y(p[key]);
   if(i){const prev=points[i-1];out+=`<line x1="${X(prev.date)}" y1="${Y(prev[key])}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="2.3" ${key==='walk'?'stroke-dasharray="4 3"':''}/>`;}
   if(i===points.length-1||i===0)out+=`<circle cx="${x}" cy="${y}" r="3.4" fill="${color}"><title>${p.date}：${key==='walk'?'ウォーキング':'ラン・走歩'} ${num(p[key])}km</title></circle>`;
  }
 }
 for(const tick of axisLabels(start,end,'day'))out+=`<text x="${X(tick.d)}" y="${H-15}" text-anchor="${tick.anchor}">${tick.label}</text>`;
 return out+'</svg>'+chartLegend()+'<p class="foot">ラン・走歩とウォーキング、それぞれの累計距離を別系列で表示。全活動の累計は両方を合計した値だよ。</p>';
}
function monthlyRows(all){
 const map=new Map();
 for(const [d,r] of all){
  const m=d.slice(0,7),v=map.get(m)||{runCount:0,runKm:0,runMin:0,walkCount:0,walkKm:0,walkMin:0};
  if(isWalk(r)){v.walkCount++;v.walkKm+=+r.km;v.walkMin+=+r.minutes;}
  else{v.runCount++;v.runKm+=+r.km;v.runMin+=+r.minutes;}
  map.set(m,v);
 }
 return [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([m,v])=>`<div class="rowline spread"><b>${m.replace('-','年')}月</b><div class="small" style="text-align:right">ラン・走歩 ${v.runCount}回／${num(v.runKm)}km<br><span class="muted">(全活動 ${v.runCount+v.walkCount}回／${num(v.runKm+v.walkKm)}km)</span>${v.walkCount?`<br><span class="walktext">歩き ${v.walkCount}回／${num(v.walkKm)}km</span>`:''}</div></div>`).join('');
}
function analysisPage(){
 const all=records(),running=trainingRecords(),walking=walkingRecords(),shown=summarize(analysisRange,all),p=progressState(),d=progressDiagnosis(),outlook=paceOutlook();
 const total=totalKm(running),allDistance=totalKm(all),mins=totalMinutes(running),best=bestKm(running),avg=total>0?mins*60/total:0;
 const {unit}=trendGroups(shown,analysisRange);
 shell('記録と大会への分析',`
 <div class="small accent" style="margin-bottom:8px">累計の主集計はラン・走歩。括弧内はウォーキングを含む全活動。</div>
 <div class="grid3"><div class="card"><div class="small muted">累計練習回数</div><div class="big">${running.length}<span class="small">回</span></div><div class="submetric">(全活動 ${all.length}回)</div></div><div class="card"><div class="small muted">累計練習距離</div><div class="big">${exactKm(total)}<span class="small">km</span></div><div class="submetric">(全活動 ${exactKm(allDistance)}km)</div></div><div class="card"><div class="small muted">最長練習</div><div class="big">${num(best)}<span class="small">km</span></div><div class="submetric">ラン＋走歩のみ</div></div></div>
 <div class="card"><div class="grid2"><div><div class="small muted">累計練習時間</div><div class="big" style="font-size:19px">${formatHours(mins)}</div><div class="submetric">(全活動 ${formatHours(totalMinutes(all))})</div></div><div><div class="small muted">ラン＋走歩の平均ペース</div><div class="big" style="font-size:19px">${pace(avg)}<span class="small">/km</span></div><div class="submetric">ウォーキングは含まない</div></div></div></div>
 <h2 class="section">大会への準備状況</h2><div class="card"><div class="spread"><b>現在の進捗：${esc(d.status)}</b><span class="tag ${d.kind==='ok'?'now':'off'}">Lv.${p.lv} / 10</span></div><p class="note">${esc(d.reason)}</p><p class="small" style="margin-top:10px"><b>完走ペースの見込み：</b>${esc(raceFeedback())}</p>
 ${checkpointTable()}<p class="foot">10:40通過なら第1関門の閉鎖直前に必要なペースは7:10/km。上の5分前ペースも全関門を一度に満たす一定ペースを保証するものではないので、最も厳しい条件を確認してね。</p>
 <p class="small"><b>現在の課題：</b>${esc(trainingFocus().name)}</p><p class="tiny muted">${esc(trainingFocus().why)}</p><button class="btn full" id="toPlan">対策と再計画を見る →</button></div>
 <h2 class="section">能力別の到達度</h2><div class="card">${abilityHtml(false)}<p class="foot">能力別の値はデータと基準を透明化するための内部指標。医学的な走力、心肺機能、完走確率を示す点数ではない。</p></div>
 <h2 class="section">距離とペースの推移</h2><div class="card"><div class="small muted">表示期間</div><div class="segmented">${[['14','14日'],['30','30日'],['all','全期間']].map(([v,n])=>`<button type="button" data-range="${v}" class="${v===analysisRange?'on':''}">${n}</button>`).join('')}</div><p class="foot">${analysisRange==='all'?'初回から現在まで。':'指定期間内。'} ラン＋走歩${shown.filter(([,r])=>!isWalk(r)).length}回、ウォーキング${shown.filter(([,r])=>isWalk(r)).length}回${unit==='week'?'（週別）':unit==='month'?'（月別）':''}。</p>
 ${chartLegend()}<div class="rowline"><b>距離の推移（km）</b>${svgTrend(shown,analysisRange,'km')}</div><div class="rowline"><b>ペースの推移（分:秒/km）</b>${svgTrend(shown,analysisRange,'pace')}</div><p class="foot">運動の種類、コース、強度が違えばペースのみで成長とは判断できない。</p></div>
 <h2 class="section">心拍数と運動負荷</h2><div class="card">
 <p class="small muted">直近の比較はランニング／走歩のみ。ウォーキングは別集計。</p>
 <div class="grid2" style="margin-top:10px"><div class="muted-card"><div class="small muted">ラン＋走歩の平均心拍</div><div class="big" style="font-size:20px">${heartSummary(trainingRecords()).average??'—'}<span class="small"> bpm</span></div><p class="tiny muted">入力あり${heartSummary(trainingRecords()).n}回・時間加重</p></div><div class="muted-card"><div class="small muted">ウォーキングの平均心拍</div><div class="big" style="font-size:20px">${heartSummary(walkingRecords()).average??'—'}<span class="small"> bpm</span></div><p class="tiny muted">入力あり${heartSummary(walkingRecords()).n}回・時間加重</p></div></div>
 <div class="note">${esc(heartEvidence().reason)}</div>
 <b style="display:block;margin-top:12px">平均心拍の推移（bpm）</b>
 ${chartLegend()}${svgHeart(shown,analysisRange)}
 <p class="foot">心拍の絶対値だけで安全性・持久力・完走可能性を判定しない。比較条件が不十分なら「蓄積中」と表示。気温、坂道、睡眠、疲労、測定差も影響する。</p>
 </div>
 <div class="card"><b>累計距離の積み上がり</b><p class="small muted">ラン＋走歩とウォーキングを別系列表示</p>${cumulativeChart(all)}</div>
 <h2 class="section">月ごとの実績</h2><div class="card">${monthlyRows(all)||'<div class="empty">まだ記録がないよ。</div>'}</div>
 <h2 class="section">全記録</h2><div class="card">${(showAllHistory?all.slice().reverse():all.slice(-12).reverse()).map(([day,r])=>`<div class="rowline spread"><div><b>${esc(day)}</b> ${isWalk(r)?'<span class="tag walktag">ウォーキング</span>':''}<div class="small muted">${num(r.km)}km ／ ${formatDuration(r.minutes)} ／ ${pace(paceOf(r))}/km${hasHeart(r)?` ／ 平均${r.hrAvg}bpm`:''}</div></div><button type="button" class="btn sub smallbtn" data-edit="${esc(day)}">編集</button></div>`).join('')||'<div class="empty">記録はまだないよ。</div>'}${all.length>12?`<button class="btn sub full" id="historyToggle">${showAllHistory?'直近12件に戻す':'すべて表示（'+all.length+'件）'}</button>`:''}</div><p class="foot">データはこの端末のWebサイト保存領域に格納。SafariのWebサイトデータを削除すると消えることがあるので注意。</p>`);
 document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{analysisRange=b.dataset.range;render()});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;tab='record';render()});
 if($('#historyToggle'))$('#historyToggle').onclick=()=>{showAllHistory=!showAllHistory;render()};
 $('#toPlan').onclick=()=>{tab='plan';render()};
}

function render(){if(tab==='home')home();else if(tab==='plan')planPage();else if(tab==='record')recordPage();else analysisPage()}
// A previous version's records are read with the same key. No migration/deletion is performed.
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
